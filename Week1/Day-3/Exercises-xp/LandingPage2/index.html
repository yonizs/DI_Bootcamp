<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="banner">
        <p>UNBURDEN YOURSELF FROM THE WEIGHT OF EMAIL OVERLOAD!</p>
        <button type="button">LEARN HOW</button>
    </header>

    <main>
        <h1>DOWNLOAD NOW</h1>
        <form>
            <div class="fields">
                <div class="field">
                    <label for="first-name">First Name*</label>
                    <input type="text" id="first-name" required>
                </div>
                <div class="field">
                    <label for="last-name">Last Name*</label>
                    <input type="text" id="last-name" required>
                </div>
                <div class="field">
                    <label for="email">Email (<a class="privacy-link" href="#">privacy policy</a>)*</label>
                    <input type="email" id="email" required>
                </div>
                <div class="field">
                    <label for="phone">Phone Number*</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="field">
                    <label for="website">Website URL*</label>
                    <input type="url" id="website" required>
                </div>
                <div class="field">
                    <label for="company">Company Name*</label>
                    <input type="text" id="company" required>
                </div>
            </div>

            <div class="field">
                <label for="employees">How many employees work there?*</label>
                <select id="employees" required>
                    <option value="">- Please Select -</option>
                    <option>Under 500</option>
                    <option>500-999</option>
                    <option>1000-2,499</option>
                    <option>2,500-4,999</option>
                    <option>5,000-9,999</option>
                    <option>10,000+</option>
                </select>
            </div>

            <div class="field">
                <label for="services">Does your company sell any of the following services:<br>
                    -Web design<br>
                    -Online Marketing<br>
                    -SEO/SEM<br>
                    -Advertising agency services?*</label>
                <select id="services" required>
                    <option value="">- Please Select -</option>
                    <option>Web Design</option>
                    <option>Online Marketing</option>
                    <option>SEO/SEM</option>
                    <option>Advertising</option>
                    <option>Other</option>
                </select>  
            </div>

            <label class="subscribe">
                <input type="checkbox">
                Subscribe to HubSpot's marketing blog
            </label>
            <button class="download" type="button">DOWNLOAD NOW</button>
        </form>

        <footer class="page-footer">
            <img src="woman.jpeg" alt="Face">
        </footer>
    </main>
</body>
</html>
