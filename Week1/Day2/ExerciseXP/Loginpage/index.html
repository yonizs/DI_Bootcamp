<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loginside">
        <h1>Log in</h1>
        <form>
            <input type="email" name="email" placeholder="email">
            <input type="password" name="password" placeholder="password">
            <div class="options">
                <label><input type="checkbox" name="remember">Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit">LOG IN</button>
        </form>
        <p class="connect">Or Connect with</p>
        <div class="social-links">
            <a href="#"><i class="fa fa-facebook"></i></a>
            <a href="#"><i class="fa fa-twitter"></i></a>
            <a href="https://github.com/yonizs"><i class="fa fa-github"></i></a>
            <a href="https://www.linkedin.com/in/jonathan-shiller-828955233/"><i class="fa fa-linkedin"></i></a>
            
        </div>
        <p class="copyright">&copy; 2020</p>
    </div>
    <div class="register">
        <i class="fa fa-user-plus"></i>
        <h1>Hello, friend!</h1>
        <p>Enter your personal details and start journey<br>with us</p>
        <a href="#" class="register-btn">Register <i class="fa fa-arrow-circle-right"></i></a>
    </div>
</body>
</html>
