 <form action="action_page.php" class="signup-page">
  <div class="container">
    <h1 class="blank">Sign Up</h1>
    <p class="blank">Please fill in this form to create an account.</p>
    <hr>

    <label for="email" class="blank"><b>Email</b></label>
    <input type="text" placeholder="Enter Email" name="email" required>
    <label for="user" class="blank"><b>Username</b></label>
    <input type="text" placeholder="Enter Username" name="user" required>

    <label for="psw" class="blank"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="psw" required>

    <label for="psw-repeat" class="blank"><b>Repeat Password</b></label>
    <input type="password" placeholder="Repeat Password" name="psw-repeat" required>
    <label for="fname" class="blank">First name:</label>
    <input type="text" placeholder="First name" id="fname" name="fname"><br><br>
    <label for="lname" class="blank">Last name:</label>
    <input type="text" placeholder="Last name" id="lname" name="lname"><br><br>
    <label>
      <input type="checkbox" checked="checked" name="remember" class="blank remember"> Remember me
    </label>

    <p class="blank">By creating an account you agree to our <a href="#" class="terms">Terms &amp; Privacy</a>.</p>

    <div class="clearfix">
      <button type="button" class="cancelbtn">Cancel</button>
      <button type="submit" class="signupbtn">Sign Up</button>
    </div>
  </div>
</form>
